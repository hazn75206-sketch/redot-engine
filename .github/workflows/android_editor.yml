name: Android Editor arm64 (APK)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-editor-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONS_FLAGS: >-
    module_text_server_fb_enabled=yes

jobs:
  build-android-editor:
    runs-on: ubuntu-24.04
    name: Editor arm64 (target=editor)
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK and NDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "NDK versions:"
          ls -1 "${ANDROID_HOME}/ndk" 2>/dev/null || true
          echo "Platforms:"
          ls -1 "${ANDROID_HOME}/platforms" 2>/dev/null || true

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: android-editor-arm64
        continue-on-error: true

      - name: Restore Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle|${{ hashFiles('platform/android/java/**/*.gradle*', 'platform/android/java/gradle.properties') }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built Android Swappy Frame Pacing Library
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-swappy
          version: tags/from-source-2025-01-31
          file: godot-swappy.7z
          target: swappy/godot-swappy.7z

      - name: Extract pre-built Android Swappy Frame Pacing Library
        run: 7za x -y swappy/godot-swappy.7z -o${{ github.workspace }}/thirdparty/swappy-frame-pacing

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            arch=arm64
            production=yes
            swappy=yes
            -j4
          platform: android
          target: editor

      - name: Save Godot build cache
        if: always()
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: android-editor-arm64
        continue-on-error: true

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle|${{ hashFiles('platform/android/java/**/*.gradle*', 'platform/android/java/gradle.properties') }}
        continue-on-error: true

      - name: Generate Redot editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l bin/android_editor_builds/
          TAG="redot-editor-$(date +%Y%m%d-%H%M)-${GITHUB_SHA:0:7}"
          gh release create "$TAG" bin/android_editor_builds/*.apk \
            --title "Redot Editor arm64 ${TAG}" \
            --notes "APK editor Redot arm64 (MCP module included). Install directly on an arm64 Android device."
          APK=$(ls bin/android_editor_builds/*.apk | head -1)
          APKNAME=$(basename "$APK")
          echo "### APK editor arm64 (download langsung)" >> "$GITHUB_STEP_SUMMARY"
          echo "[$APKNAME](https://github.com/${{ github.repository }}/releases/download/$TAG/$APKNAME)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: android-editor-arm64
          path: bin/android_editor_builds/
